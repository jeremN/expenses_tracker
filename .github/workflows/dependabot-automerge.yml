name: Dependabot auto-merge

on: pull_request

# Dependabot-triggered runs get a read-only GITHUB_TOKEN by default; this
# block restores the write scopes that `gh pr merge` needs.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    # Only act on Dependabot's own PRs.
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Read update metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # For grouped PRs, update-type is the highest semver bump in the group.
      # The dependabot.yml group only contains minor+patch, so majors always
      # arrive ungrouped and are excluded here -> they wait for manual review.
      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
